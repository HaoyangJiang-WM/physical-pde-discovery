name: Publish active equation discovery
on:
  push:
    branches: [publish-active-equations-20261112]
    paths:
      - '.github/workflows/publish-active-equations.yml'
      - '.publish/READY'
permissions:
  contents: write
jobs:
  reconstruct:
    name: Reconstruct ${{ matrix.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [main, extras]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct frozen numerical records
        run: python .publish/phase.py ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        with:
          name: active-${{ matrix.phase }}
          path: publication-payload/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Validate and publish main
    needs: reconstruct
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore frozen source and publication finalizer
        run: python .publish/phase.py prepare
      - uses: actions/download-artifact@v4
        with:
          pattern: active-*
          merge-multiple: true
          path: .
      - name: Rebuild figures and validate complete replacement
        run: python "$RUNNER_TEMP/active-finalize.py"
      - name: Preserve publication files for recovery
        if: always()
        run: |
          tar --exclude='./.git' --exclude='./benchmark/cache' --exclude='*/__pycache__' --exclude='./outputs' -czf "$RUNNER_TEMP/active-published-project.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-publication-files
          path: ${{ runner.temp }}/active-published-project.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Publish validated replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace repository contents with active equation discovery benchmark, visual README and reproducible experiments'
          git push origin HEAD:main
