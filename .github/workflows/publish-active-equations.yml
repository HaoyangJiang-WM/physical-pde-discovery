name: Publish active equation discovery
on:
  push:
    branches: [publish-active-equations-20261112]
    paths:
      - '.github/workflows/publish-active-equations.yml'
      - '.publish/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check publication payload
        id: payload
        run: |
          if test -f .publish/READY; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Publication staging is ready. The main branch has not been changed.'
          fi
      - uses: actions/setup-python@v5
        if: steps.payload.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Restore and validate project
        if: steps.payload.outputs.ready == 'true'
        run: python .publish/restore.py
      - name: Publish validated replacement
        if: steps.payload.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace repository contents with active equation discovery benchmark, visual README and reproducible experiments'
          git push origin HEAD:main
