name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python src/domains.py check
      - run: python src/graphs.py check
      - run: python src/report.py > /dev/null
      - run: python src/experiments.py points 1 lorenz 0.1 esindy+variance,esindy_wt+iopt /tmp/smoke.json
