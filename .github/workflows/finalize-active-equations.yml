name: Finalize active equation discovery
on:
  push:
    branches: [publish-active-equations-20261112]
    paths:
      - '.github/workflows/finalize-active-equations.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for verified reconstruction artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 43273585155;
            const deadline = Date.now() + 12 * 60 * 1000;
            let ready = false;
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id, per_page: 100
              });
              const names = response.data.artifacts.filter(a => !a.expired).map(a => a.name);
              if (names.includes('active-main') && names.includes('active-extras')) {
                ready = true;
                core.info('Both reconstructed numerical payloads are available.');
                break;
              }
              const run = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.data.status === 'completed') {
                throw new Error('Reconstruction ended before both required artifacts were available.');
              }
              core.info('Waiting for reconstruction artifacts; main remains unchanged.');
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            if (!ready) throw new Error('Reconstruction artifacts were not ready before the deadline.');
      - name: Restore source and corrected publication finalizer
        run: python .publish/phase.py prepare
      - uses: actions/download-artifact@v4
        with:
          run-id: 43273585155
          github-token: ${{ github.token }}
          pattern: active-*
          merge-multiple: true
          path: .
      - name: Generate and validate complete project
        run: python "$RUNNER_TEMP/active-finalize.py"
      - name: Save recovery archive
        if: always()
        run: |
          tar --exclude='./.git' --exclude='./benchmark/cache' --exclude='*/__pycache__' --exclude='./outputs' -czf "$RUNNER_TEMP/active-equation-discovery.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-equation-discovery-publication
          path: ${{ runner.temp }}/active-equation-discovery.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Publish replacement without rewriting history
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = '2d0719f11b37063f874aa0ca5a9dde7cdeed54ab'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish active equation discovery: two selectors, five GIFs, failure cases and reproducible benchmark'
          git push origin HEAD:main
